name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */6 * * *"   # runs every 6 hours
  workflow_dispatch: {}      # lets you trigger it manually from the Actions tab
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake SVG (light + dark)
        uses: Platane/snk@v3
        with:
          github_user_name: moulisiddhu487-svg
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23FF2800&color_dots=%230e2c1c,%23155a2c,%2226a641,%2339d353,%2356f470&color_dots_border=%230A0E27
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%23FF2800&color_dots=%230e2c1c,%23155a2c,%2226a641,%2339d353,%2356f470&color_dots_border=%230A0E27

      - name: Push output to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
