name: Update Profile

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "config.yml"
      - "scripts/**"
      - "templates/**"

permissions:
  contents: write

jobs:
  update-profile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install generator dependencies
        run: python -m pip install --upgrade pip PyYAML

      - name: Generate live contribution flow
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate_contributions_svg.py

      - name: Generate GitHub telemetry and project showcase
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate_bento_svg.py

      - name: Generate skills radar
        run: python scripts/generate_skills_svg.py

      - name: Render README from config
        run: python scripts/render_readme.py

      - name: Commit generated profile updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/contributions.svg assets/bento.svg assets/skills.svg
          if git diff --cached --quiet; then
            echo "No profile changes to commit."
            exit 0
          fi
          git commit -m "chore: auto-update profile stats [skip ci]"
          git push
