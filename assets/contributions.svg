<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 890 240" width="100%" height="auto" fill="none">
  <defs>
    <style>
      @keyframes drawLine {
        0% { stroke-dashoffset: 2000; opacity: 0; }
        10% { opacity: 1; }
        100% { stroke-dashoffset: 0; opacity: 1; }
      }
      @keyframes areaFade {
        0% { opacity: 0; }
        100% { opacity: 1; }
      }
      @keyframes haloPulse {
        0%, 100% { opacity: .55; transform: scale(1); }
        50% { opacity: .12; transform: scale(1.7); }
      }
      @keyframes dotBlink {
        0%, 100% { opacity: 1; }
        50% { opacity: .4; }
      }
      .flow-line {
        stroke-dasharray: 2000;
        stroke-dashoffset: 0;
        animation: drawLine 1.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      .flow-area {
        opacity: 0;
        animation: areaFade 1.6s ease-in-out .25s forwards;
      }
      .halo {
        transform-box: fill-box;
        transform-origin: center;
        animation: haloPulse 2.6s ease-in-out infinite;
      }
      .live-dot { animation: dotBlink 2.6s ease-in-out infinite; }
    </style>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12171f"/>
      <stop offset="1" stop-color="#0a0d12"/>
    </linearGradient>
    <radialGradient id="glowSpot" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#3fb950" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#3fb950" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2ea043"/>
      <stop offset="0.55" stop-color="#3fb950"/>
      <stop offset="1" stop-color="#7ee787"/>
    </linearGradient>
    <linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3fb950" stop-opacity="0.30"/>
      <stop offset="0.6" stop-color="#3fb950" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#3fb950" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ruleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3fb950" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#3fb950" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#3fb950" stop-opacity="0"/>
    </linearGradient>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Card -->
  <rect width="890" height="240" rx="14" fill="url(#bgGrad)" stroke="#2b333c" stroke-width="1"/>
  <rect x="1" y="1" width="888" height="238" rx="13" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
  <rect width="890" height="240" rx="14" fill="url(#glowSpot)"/>

  <!-- Header -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <g transform="translate(28, 22)">
      <rect x="0" y="0" width="30" height="22" rx="6" fill="#182030" stroke="#3fb950" stroke-opacity="0.4" stroke-width="1"/>
      <text x="15" y="15" text-anchor="middle" fill="#7ee787" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700">~/</text>
      <text x="40" y="15" fill="#eef2f6" font-size="14" font-weight="650" letter-spacing="0.2">Activity &amp; Contribution Flow</text>
    </g>
    <!-- Hero stat: total year contributions -->
    <g transform="translate(862, 16)" text-anchor="end">
      <circle class="live-dot" cx="-104" cy="8" r="4" fill="#3fb950"/>
      <text x="0" y="4" fill="#7ee787" font-size="26" font-weight="700" letter-spacing="0.5">202</text>
      <text x="0" y="20" fill="#8b949e" font-size="10" letter-spacing="1.6">TOTAL THIS YEAR</text>
      <text x="0" y="36" fill="#5d6772" font-size="10">1 in last 30 days · peak 1/day</text>
    </g>
    <line x1="28" y1="64" x2="862" y2="64" stroke="url(#ruleGrad)" stroke-width="1"/>
  </g>

  <!-- Background Grids & Labels -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#6e7681">
    <line x1="50" y1="200.0" x2="855" y2="200.0" stroke="#1c232c" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="40" y="204.0" text-anchor="end">0</text>
    <line x1="50" y1="163.8" x2="855" y2="163.8" stroke="#1c232c" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="40" y="167.8" text-anchor="end">2</text>
    <line x1="50" y1="127.5" x2="855" y2="127.5" stroke="#1c232c" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="40" y="131.5" text-anchor="end">4</text>
    <line x1="50" y1="90.2" x2="855" y2="90.2" stroke="#1c232c" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="40" y="94.2" text-anchor="end">6</text>
    <text x="50.0" y="220" text-anchor="middle">Sep 09</text>
    <text x="211.0" y="220" text-anchor="middle">Sep 15</text>
    <text x="372.0" y="220" text-anchor="middle">Sep 21</text>
    <text x="533.0" y="220" text-anchor="middle">Sep 27</text>
    <text x="694.0" y="220" text-anchor="middle">Oct 03</text>
    <text x="855.0" y="220" text-anchor="middle">Oct 09</text>
  </g>

  <!-- Area Fill -->
  <path class="flow-area" d="M 50.0,200.0 C 55.4,200.0 66.1,200.0 76.8,200.0 C 87.6,200.0 92.9,200.0 103.7,200.0 C 114.4,200.0 119.8,200.0 130.5,200.0 C 141.2,200.0 146.6,200.0 157.3,200.0 C 168.1,200.0 173.4,203.7 184.2,200.0 C 194.9,196.3 200.3,181.7 211.0,181.7 C 221.7,181.7 227.1,196.3 237.8,200.0 C 248.6,203.7 253.9,200.0 264.7,200.0 C 275.4,200.0 280.8,200.0 291.5,200.0 C 302.2,200.0 307.6,200.0 318.3,200.0 C 329.1,200.0 334.4,200.0 345.2,200.0 C 355.9,200.0 361.3,200.0 372.0,200.0 C 382.7,200.0 388.1,200.0 398.8,200.0 C 409.6,200.0 414.9,200.0 425.7,200.0 C 436.4,200.0 441.8,200.0 452.5,200.0 C 463.2,200.0 468.6,200.0 479.3,200.0 C 490.1,200.0 495.4,200.0 506.2,200.0 C 516.9,200.0 522.3,200.0 533.0,200.0 C 543.7,200.0 549.1,200.0 559.8,200.0 C 570.6,200.0 575.9,200.0 586.7,200.0 C 597.4,200.0 602.8,200.0 613.5,200.0 C 624.2,200.0 629.6,200.0 640.3,200.0 C 651.1,200.0 656.4,200.0 667.2,200.0 C 677.9,200.0 683.3,200.0 694.0,200.0 C 704.7,200.0 710.1,200.0 720.8,200.0 C 731.6,200.0 736.9,200.0 747.7,200.0 C 758.4,200.0 763.8,200.0 774.5,200.0 C 785.2,200.0 790.6,200.0 801.3,200.0 C 812.1,200.0 817.4,200.0 828.2,200.0 C 838.9,200.0 849.6,200.0 855.0,200.0 L 855.0,200 L 50.0,200 Z" fill="url(#areaGrad)"/>

  <!-- Spline Curve Line -->
  <path class="flow-line" d="M 50.0,200.0 C 55.4,200.0 66.1,200.0 76.8,200.0 C 87.6,200.0 92.9,200.0 103.7,200.0 C 114.4,200.0 119.8,200.0 130.5,200.0 C 141.2,200.0 146.6,200.0 157.3,200.0 C 168.1,200.0 173.4,203.7 184.2,200.0 C 194.9,196.3 200.3,181.7 211.0,181.7 C 221.7,181.7 227.1,196.3 237.8,200.0 C 248.6,203.7 253.9,200.0 264.7,200.0 C 275.4,200.0 280.8,200.0 291.5,200.0 C 302.2,200.0 307.6,200.0 318.3,200.0 C 329.1,200.0 334.4,200.0 345.2,200.0 C 355.9,200.0 361.3,200.0 372.0,200.0 C 382.7,200.0 388.1,200.0 398.8,200.0 C 409.6,200.0 414.9,200.0 425.7,200.0 C 436.4,200.0 441.8,200.0 452.5,200.0 C 463.2,200.0 468.6,200.0 479.3,200.0 C 490.1,200.0 495.4,200.0 506.2,200.0 C 516.9,200.0 522.3,200.0 533.0,200.0 C 543.7,200.0 549.1,200.0 559.8,200.0 C 570.6,200.0 575.9,200.0 586.7,200.0 C 597.4,200.0 602.8,200.0 613.5,200.0 C 624.2,200.0 629.6,200.0 640.3,200.0 C 651.1,200.0 656.4,200.0 667.2,200.0 C 677.9,200.0 683.3,200.0 694.0,200.0 C 704.7,200.0 710.1,200.0 720.8,200.0 C 731.6,200.0 736.9,200.0 747.7,200.0 C 758.4,200.0 763.8,200.0 774.5,200.0 C 785.2,200.0 790.6,200.0 801.3,200.0 C 812.1,200.0 817.4,200.0 828.2,200.0 C 838.9,200.0 849.6,200.0 855.0,200.0" fill="none" stroke="url(#lineGrad)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" filter="url(#softGlow)"/>

  <!-- Data Point -->
  <g>
    <circle class="halo" cx="211.0" cy="181.7" r="8" fill="#3fb950"/>
    <circle cx="211.0" cy="181.7" r="4" fill="#7ee787" stroke="#0a0d12" stroke-width="1.5" filter="url(#softGlow)">
      <title>1 contribution on 2026-09-15</title>
    </circle>
  </g>
</svg>
