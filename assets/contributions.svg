<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 890 240" width="100%" height="auto" fill="none">
  <defs>
    <style>
      @keyframes drawLine {
        0% { stroke-dashoffset: 2000; opacity: 0; }
        10% { opacity: 1; }
        100% { stroke-dashoffset: 0; opacity: 1; }
      }
      @keyframes areaFade {
        0% { opacity: 0; }
        100% { opacity: 1; }
      }
      @keyframes haloPulse {
        0%, 100% { opacity: .55; transform: scale(1); }
        50% { opacity: .12; transform: scale(1.7); }
      }
      @keyframes dotBlink {
        0%, 100% { opacity: 1; }
        50% { opacity: .4; }
      }
      .flow-line {
        stroke-dasharray: 2000;
        stroke-dashoffset: 0;
        animation: drawLine 1.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      .flow-area {
        opacity: 0;
        animation: areaFade 1.6s ease-in-out .25s forwards;
      }
      .halo {
        transform-box: fill-box;
        transform-origin: center;
        animation: haloPulse 2.6s ease-in-out infinite;
      }
      .live-dot { animation: dotBlink 2.6s ease-in-out infinite; }
    </style>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12171f"/>
      <stop offset="1" stop-color="#0a0d12"/>
    </linearGradient>
    <radialGradient id="glowSpot" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#3fb950" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#3fb950" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2ea043"/>
      <stop offset="0.55" stop-color="#3fb950"/>
      <stop offset="1" stop-color="#7ee787"/>
    </linearGradient>
    <linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3fb950" stop-opacity="0.30"/>
      <stop offset="0.6" stop-color="#3fb950" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#3fb950" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ruleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3fb950" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#3fb950" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#3fb950" stop-opacity="0"/>
    </linearGradient>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Card -->
  <rect width="890" height="240" rx="14" fill="url(#bgGrad)" stroke="#2b333c" stroke-width="1"/>
  <rect x="1" y="1" width="888" height="238" rx="13" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
  <rect width="890" height="240" rx="14" fill="url(#glowSpot)"/>

  <!-- Header -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <g transform="translate(28, 30)">
      <rect x="0" y="0" width="30" height="22" rx="6" fill="#182030" stroke="#3fb950" stroke-opacity="0.4" stroke-width="1"/>
      <text x="15" y="15" text-anchor="middle" fill="#7ee787" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700">~/</text>
      <text x="40" y="15" fill="#eef2f6" font-size="14" font-weight="650" letter-spacing="0.2">Activity &amp; Contribution Flow</text>
    </g>
    <!-- Hero stat: total year contributions -->
    <g transform="translate(862, 26)" text-anchor="end">
      <text x="0" y="6" fill="#e3b341" font-size="26" font-weight="700" letter-spacing="0.5">214</text>
      <circle class="live-dot" cx="-121" cy="22" r="4" fill="#3fb950"/>
      <text x="0" y="26" fill="#8b949e" font-size="10" letter-spacing="1.6">TOTAL THIS YEAR</text>
      <text x="0" y="40" fill="#5d6772" font-size="10">12 in last 30 days &#183; peak 55/day this year</text>
    </g>
    <line x1="28" y1="76" x2="862" y2="76" stroke="url(#ruleGrad)" stroke-width="1"/>
  </g>

  <!-- Background Grids & Labels -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#6e7681">
    <line x1="50" y1="200.0" x2="855" y2="200.0" stroke="#1c232c" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="40" y="204.0" text-anchor="end" fill="#6e7681" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10">0</text>
    <line x1="50" y1="163.8" x2="855" y2="163.8" stroke="#1c232c" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="40" y="167.8" text-anchor="end" fill="#6e7681" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10">4</text>
    <line x1="50" y1="127.5" x2="855" y2="127.5" stroke="#1c232c" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="40" y="131.5" text-anchor="end" fill="#6e7681" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10">7</text>
    <line x1="50" y1="90.2" x2="855" y2="90.2" stroke="#1c232c" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="40" y="94.2" text-anchor="end" fill="#6e7681" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10">11</text>
    <text x="50.0" y="220" text-anchor="middle" fill="#6e7681" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10">Sep 10</text>
    <text x="216.6" y="220" text-anchor="middle" fill="#6e7681" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10">Sep 16</text>
    <text x="383.1" y="220" text-anchor="middle" fill="#6e7681" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10">Sep 22</text>
    <text x="549.7" y="220" text-anchor="middle" fill="#6e7681" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10">Sep 28</text>
    <text x="716.2" y="220" text-anchor="middle" fill="#6e7681" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10">Oct 04</text>
  </g>

  <!-- Area Fill -->
  <path class="flow-area" d="M 50.0,200.0 C 55.6,200.0 66.7,200.0 77.8,200.0 C 88.9,200.0 94.4,200.0 105.5,200.0 C 116.6,200.0 122.2,200.0 133.3,200.0 C 144.4,200.0 149.9,202.0 161.0,200.0 C 172.1,198.0 177.7,190.0 188.8,190.0 C 199.9,190.0 205.4,198.0 216.6,200.0 C 227.7,202.0 233.2,200.0 244.3,200.0 C 255.4,200.0 261.0,200.0 272.1,200.0 C 283.2,200.0 288.7,200.0 299.8,200.0 C 310.9,200.0 316.5,200.0 327.6,200.0 C 338.7,200.0 344.2,200.0 355.3,200.0 C 366.4,200.0 372.0,200.0 383.1,200.0 C 394.2,200.0 399.8,200.0 410.9,200.0 C 422.0,200.0 427.5,200.0 438.6,200.0 C 449.7,200.0 455.3,200.0 466.4,200.0 C 477.5,200.0 483.0,200.0 494.1,200.0 C 505.2,200.0 510.8,200.0 521.9,200.0 C 533.0,200.0 538.6,200.0 549.7,200.0 C 560.8,200.0 566.3,200.0 577.4,200.0 C 588.5,200.0 594.1,200.0 605.2,200.0 C 616.3,200.0 621.8,200.0 632.9,200.0 C 644.0,200.0 649.6,200.0 660.7,200.0 C 671.8,200.0 677.3,200.0 688.4,200.0 C 699.6,200.0 705.1,200.0 716.2,200.0 C 727.3,200.0 732.9,200.0 744.0,200.0 C 755.1,200.0 760.6,200.0 771.7,200.0 C 782.8,200.0 788.4,200.0 799.5,200.0 C 810.6,200.0 816.1,222.0 827.2,200.0 C 838.3,178.0 849.4,112.2 855.0,90.2 L 855.0,200 L 50.0,200 Z" fill="url(#areaGrad)"/>

  <!-- Spline Curve Line -->
  <path class="flow-line" d="M 50.0,200.0 C 55.6,200.0 66.7,200.0 77.8,200.0 C 88.9,200.0 94.4,200.0 105.5,200.0 C 116.6,200.0 122.2,200.0 133.3,200.0 C 144.4,200.0 149.9,202.0 161.0,200.0 C 172.1,198.0 177.7,190.0 188.8,190.0 C 199.9,190.0 205.4,198.0 216.6,200.0 C 227.7,202.0 233.2,200.0 244.3,200.0 C 255.4,200.0 261.0,200.0 272.1,200.0 C 283.2,200.0 288.7,200.0 299.8,200.0 C 310.9,200.0 316.5,200.0 327.6,200.0 C 338.7,200.0 344.2,200.0 355.3,200.0 C 366.4,200.0 372.0,200.0 383.1,200.0 C 394.2,200.0 399.8,200.0 410.9,200.0 C 422.0,200.0 427.5,200.0 438.6,200.0 C 449.7,200.0 455.3,200.0 466.4,200.0 C 477.5,200.0 483.0,200.0 494.1,200.0 C 505.2,200.0 510.8,200.0 521.9,200.0 C 533.0,200.0 538.6,200.0 549.7,200.0 C 560.8,200.0 566.3,200.0 577.4,200.0 C 588.5,200.0 594.1,200.0 605.2,200.0 C 616.3,200.0 621.8,200.0 632.9,200.0 C 644.0,200.0 649.6,200.0 660.7,200.0 C 671.8,200.0 677.3,200.0 688.4,200.0 C 699.6,200.0 705.1,200.0 716.2,200.0 C 727.3,200.0 732.9,200.0 744.0,200.0 C 755.1,200.0 760.6,200.0 771.7,200.0 C 782.8,200.0 788.4,200.0 799.5,200.0 C 810.6,200.0 816.1,222.0 827.2,200.0 C 838.3,178.0 849.4,112.2 855.0,90.2" fill="none" stroke="url(#lineGrad)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" filter="url(#softGlow)"/>

  <!-- Data Point Circles -->
  <g>
    <circle class="halo" cx="188.8" cy="190.0" r="7.2" fill="#f85149"/>
    <circle cx="188.8" cy="190.0" r="2.7" fill="#f85149" stroke="#0a0d12" stroke-width="1.5" filter="url(#softGlow)">
      <title>1 contribution on 2026-09-15</title>
    </circle>
    <circle class="halo" cx="855.0" cy="90.2" r="9.0" fill="#f85149"/>
    <circle cx="855.0" cy="90.2" r="4.5" fill="#f85149" stroke="#0a0d12" stroke-width="1.5" filter="url(#softGlow)">
      <title>11 contributions on 2026-10-09</title>
    </circle>
  </g>
</svg>
